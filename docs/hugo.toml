baseURL = "https://yunier-rojas.github.io/minipaas/"
languageCode = "en-us"
title = "MiniPaaS"

enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.highlight]
    noClasses = false

[params]
  description = "Lightweight Swarm-based PaaS toolkit."

  [params.author]
    name = "Yunier Rojas García"

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    displayCopyright = true
    displayPoweredBy = false

  [params.editURL]
    enable = true
    base = "https://github.com/yunier-rojas/minipaas/edit/main/docs/content"

  [params.search]
    enable = true
    type = "flexsearch"

  [params.theme]
    default = "system"
    displayToggle = true

